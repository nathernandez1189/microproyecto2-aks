apiVersion: v1
kind: Namespace
metadata:
  name: mp2-hpa
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cpu-demo, namespace: mp2-hpa}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cpu-demo}
  template:
    metadata:
      labels: {app: cpu-demo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cpu-demo
          image: mp2-loadtarget:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: cpu-demo, namespace: mp2-hpa}
spec:
  selector: {app: cpu-demo}
  ports: [{port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cpu-demo, namespace: mp2-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cpu-demo}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
---
apiVersion: batch/v1
kind: Job
metadata: {name: load-generator, namespace: mp2-hpa}
spec:
  suspend: true
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: load
          image: busybox:1.37
          command: [/bin/sh, -c]
          args:
            - 'for i in 1 2 3 4; do (while true; do wget -q -O /dev/null http://cpu-demo; sleep 0.01; done) & done; wait'
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
